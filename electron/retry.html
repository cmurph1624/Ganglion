<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ganglion — waiting for server</title>
  <!--
    Deliberately standalone. This page loads NONE of renderer/, because under file://
    there is no location.host and renderer/client.js builds its socket from
    `ws://${location.host}` -- pointing this window at the real UI while the server is
    down would look broken rather than disconnected.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    main { text-align: center; max-width: 34rem; padding: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 .5rem; }
    .url { font-family: Consolas, "Cascadia Mono", monospace; color: #9cdcfe; font-size: .95rem; }
    .status { margin: 1.25rem 0; min-height: 1.2em; color: #999; font-size: .9rem; }
    .status.found { color: #6a9955; }
    button {
      background: #0e639c; color: #fff; border: 0; border-radius: 3px;
      padding: .5rem 1.25rem; font-size: .9rem; cursor: pointer;
    }
    button:hover { background: #1177bb; }
    button:disabled { opacity: .5; cursor: default; }
    .hint {
      margin-top: 2rem; font-size: .8rem; color: #777; line-height: 1.6;
      border-top: 1px solid #333; padding-top: 1rem;
    }
    .hint code {
      font-family: Consolas, "Cascadia Mono", monospace;
      background: #2a2a2a; padding: .1rem .35rem; border-radius: 2px; color: #ccc;
    }
  </style>
</head>
<body>
  <main>
    <h1>Waiting for the Ganglion server</h1>
    <div class="url" id="url"></div>
    <div class="status" id="status">Retrying automatically…</div>
    <button id="retry">Retry now</button>
    <div class="hint">
      The server is managed by pm2 and is not started by this window.
      Check it from a shell <strong>outside</strong> Ganglion:<br />
      <code>pm2 list</code> &nbsp;·&nbsp; <code>pm2 restart ganglion</code><br />
      Restarting from inside a Ganglion tab kills the terminal running the command.
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('url').textContent = params.get('url') || '';

    const statusEl = document.getElementById('status');
    const button = document.getElementById('retry');

    button.addEventListener('click', async () => {
      button.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Checking…';

      const alive = await window.ganglionDesktop?.retry();
      if (alive) {
        // The main process is already loading the app over this window.
        statusEl.className = 'status found';
        statusEl.textContent = 'Found it — connecting…';
        return;
      }

      statusEl.textContent = 'Still not answering. Retrying automatically…';
      button.disabled = false;
    });
  </script>
</body>
</html>
