name: CI & Gated Deploy

# CI runs on every push and PR. Deploy is GATED: it fires only on a v* tag push
# or a manual workflow_dispatch — never automatically on a merge to main. Ganglion
# is an unauthenticated remote shell, so a push must not be one hop from restarting
# it on the box.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/tag to deploy (blank = latest v* tag on the box)'
        required: false
        default: ''

concurrency:
  group: ganglion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test (install + rebuild native + node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # must match the box's ABI (native modules)
          cache: 'npm'
      # node-pty & better-sqlite3 build from source.
      - name: Ensure native build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Install (clean, rebuilds native modules for Linux)
        run: npm ci
      - name: Test
        run: npm test

  deploy:
    name: Deploy over Tailscale
    needs: ci
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ganglion-deploy
      cancel-in-progress: false
    steps:
      # Join the tailnet as an ephemeral node instead of opening the SSH-only
      # security group to GitHub's (wide, changing) runner IP ranges. The runner
      # reaches the box on its tailnet IP over WireGuard; the public SG is untouched.
      - name: Join tailnet (ephemeral node)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}   # repo variable: the box's MagicDNS name or tailnet IP
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "::error::Set the DEPLOY_HOST repository variable"; exit 1; fi
          ssh -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 ubuntu@"$DEPLOY_HOST" \
            "bash /home/ubuntu/dev/Ganglion/deploy/deploy.sh '$DEPLOY_REF'"
