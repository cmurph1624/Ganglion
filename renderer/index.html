<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ganglion</title>
  <link rel="stylesheet" href="/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="tab-bar">
    <div id="tab-list"></div>
    <button id="new-tab-btn" title="New tab">+</button>
  </div>
  <div id="tab-panes"></div>

  <script src="/xterm.js"></script>
  <script src="/addon-fit.js"></script>
  <!-- WebGL renderer (faster over RDP) and Unicode 11 widths, so Claude Code's box-drawing
       and emoji do not misalign. Both optional: renderer.js degrades to xterm's defaults if
       either fails to load or to initialise. -->
  <script src="/addon-webgl.js"></script>
  <script src="/addon-unicode11.js"></script>
  <script src="/marked.js"></script>
  <!-- Shared/view state split, served from lib/ so the server and the renderer cannot
       disagree about which tab fields are per-client. Must load before client.js. -->
  <script src="/tab-state.js"></script>
  <script src="/client.js"></script>
  <!-- Shared key policy: must load before both consumers (renderer.js terminals and the
       memory overlay) so neither has to re-derive which keys belong to the app. -->
  <script src="terminal-keys.js"></script>
  <!-- Clipboard writer, used by the terminal copy binding. Separate because the async
       Clipboard API is unavailable in the plain-HTTP Mac front-end. -->
  <script src="clipboard.js"></script>
  <!-- Binds the two together onto a live xterm; must load before renderer.js uses it. -->
  <script src="terminal-copy.js"></script>
  <script src="renderer.js"></script>
  <script src="memory-panel.js"></script>
</body>
</html>
